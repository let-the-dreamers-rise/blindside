# A whole Midnight network on one machine: node, indexer and proof server.
# Versions follow the support matrix for Compact 0.31.1 / compact-runtime 0.16.0.
services:
  proof-server:
    container_name: 'blindside-proof-server'
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    # No healthcheck: the image has no curl, and readiness is visible in its log line
    # "Actix runtime found; starting in Actix runtime".

  node:
    container_name: 'blindside-node'
    image: 'midnightntwrk/midnight-node:1.0.2'
    ports:
      - '9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexer:
    container_name: 'blindside-indexer'
    image: 'midnightntwrk/indexer-standalone:4.3.3-hotfix'
    env_file: standalone.env
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
