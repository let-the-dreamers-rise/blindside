# A whole Midnight network on one machine: node, indexer and proof server.
# Versions follow the support matrix for Compact 0.31.1 / compact-runtime 0.16.0.
services:
  proof-server:
    container_name: 'blindside-proof-server'
    image: 'midnightntwrk/proof-server:8.1.0'
    restart: unless-stopped
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    volumes:
      # On first run the prover downloads ~40 MB of proving keys from
      # srs.midnight.network. Keeping them in a volume means that happens once,
      # not on every up, and a rebuilt stack is ready in seconds.
      - zk-params:/.cache/midnight/zk-params
    # No healthcheck: the image has no curl, and readiness is visible in its log line
    # "Actix runtime found; starting in Actix runtime".

  node:
    container_name: 'blindside-node'
    image: 'midnightntwrk/midnight-node:1.0.2'
    restart: unless-stopped
    ports:
      - '9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    # Not just "is it up": the indexer's SPO task reads block 1 on startup and exits if it is
    # missing, so the node is only healthy once it has produced a second block.
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          curl -sf -H 'content-type: application/json'
          -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}'
          http://localhost:9944 | grep -qv '"number":"0x0"'
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

  indexer:
    container_name: 'blindside-indexer'
    image: 'midnightntwrk/indexer-standalone:4.3.3-hotfix'
    restart: unless-stopped
    env_file: standalone.env
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

volumes:
  zk-params:
